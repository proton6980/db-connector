<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - DB Connector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
<div class="card shadow" style="width:360px">
    <div class="card-body">
        <h4 class="card-title text-center mb-4">DB Connector 控制台</h4>
        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label" for="password">口令</label>
                <input class="form-control" type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit" id="login-btn">登录</button>
        </form>
    </div>
</div>

<script type="module">
    import { api } from './js/api.js';

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('login-btn');

    function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove('d-none');
    }

    function hideError() {
        errorEl.classList.add('d-none');
        errorEl.textContent = '';
    }

    function goApp() {
        window.location.href = '/index.html#/dashboard';
    }

    async function bootstrap() {
        try {
            const me = await api.get('/api/auth/me');
            if (me.authenticated) {
                goApp();
                return;
            }
            if (!me.passwordConfigured) {
                // Backend allows unauthenticated access when no password is set.
                goApp();
            }
        } catch (_) {
            // Stay on login if me check fails.
        }
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideError();
        submitBtn.disabled = true;
        try {
            const result = await api.post('/api/auth/login', { password: passwordInput.value });
            if (result.csrf) {
                api.setCsrf(result.csrf);
            }
            goApp();
        } catch (err) {
            showError(err.message || '登录失败');
            submitBtn.disabled = false;
        }
    });

    bootstrap();
</script>
</body>
</html>
