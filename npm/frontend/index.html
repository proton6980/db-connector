<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DB Connector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script>window.__DBCONNECTOR_API_URL__ = window.__DBCONNECTOR_API_URL__ || 'http://127.0.0.1:' + (new URLSearchParams(window.location.search).get('apiPort') || '63306');</script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#/dashboard">DB Connector</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="切换导航">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="#/dashboard" data-nav="dashboard">仪表盘</a>
                <a class="nav-link" href="#/connections" data-nav="connections">连接管理</a>
                <a class="nav-link" href="#/logs" data-nav="logs">审计日志</a>
            </div>
            <div class="navbar-nav">
                <button class="btn btn-link nav-link" type="button" id="logout-btn">退出</button>
            </div>
        </div>
    </div>
</nav>

<main class="container mt-3">
    <div id="alert-root"></div>
    <div id="app">
        <p class="text-muted">加载中…</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { api } from './js/api.js';
    import { alert } from './js/alert.js';
    import { startRouter, setActiveNav } from './js/router.js';

    document.getElementById('logout-btn').addEventListener('click', async () => {
        try {
            await api.post('/api/auth/logout');
            api.clearAuth();
            window.location.href = '/login.html';
        } catch (err) {
            alert.error(err.message || '退出失败');
            try {
                const me = await api.get('/api/auth/me');
                if (me.csrf) {
                    api.setCsrf(me.csrf);
                }
            } catch (_) {
                // keep existing local csrf if /me also fails
            }
        }
    });

    async function bootstrap() {
        try {
            const me = await api.get('/api/auth/me');
            if (me.csrf) {
                api.setCsrf(me.csrf);
            }
            if (!me.authenticated && me.passwordConfigured) {
                window.location.href = '/login.html';
                return;
            }
        } catch (_) {
            window.location.href = '/login.html';
            return;
        }

        window.addEventListener('hashchange', setActiveNav);
        setActiveNav();
        startRouter(document.getElementById('app'));
    }

    bootstrap();
</script>
</body>
</html>
