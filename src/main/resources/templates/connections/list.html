<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('连接管理')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alert}"></div>
<div class="container mt-3">
    <div class="d-flex justify-content-between mb-3">
        <h4>连接管理</h4>
        <a class="btn btn-primary" th:href="@{/connections/new}">新建连接</a>
    </div>
    <table class="table table-hover">
        <thead class="table-light">
        <tr>
            <th>名称</th>
            <th>类型</th>
            <th>主机:端口</th>
            <th>状态</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${connections}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.dbType}"></td>
            <td><span th:text="${c.host}"></span>:<span th:text="${c.port}"></span></td>
            <td>
                <span th:if="${c.active}" class="badge bg-success">启用</span>
                <span th:unless="${c.active}" class="badge bg-secondary">停用</span>
            </td>
            <td>
                <form method="post" th:action="@{/connections/{id}/test(id=${c.id})}" style="display:inline">
                    <input type="hidden" name="_csrf" th:value="${session.__csrf}">
                    <button class="btn btn-sm btn-outline-info" type="submit">测试</button>
                </form>
                <form method="post" th:action="@{/connections/{id}/reload(id=${c.id})}" style="display:inline">
                    <input type="hidden" name="_csrf" th:value="${session.__csrf}">
                    <button class="btn btn-sm btn-outline-warning" type="submit">重载</button>
                </form>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/connections/{id}/edit(id=${c.id})}">编辑</a>
                <form method="post" th:action="@{/connections/{id}/delete(id=${c.id})}" style="display:inline"
                      onsubmit="return confirm('确认删除此连接？')">
                    <input type="hidden" name="_csrf" th:value="${session.__csrf}">
                    <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(connections)}">
            <td colspan="5" class="text-center text-muted">暂无连接</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
