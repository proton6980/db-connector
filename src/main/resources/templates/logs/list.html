<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('审计日志')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container mt-3">
    <h4 class="mb-3">审计日志</h4>

    <form method="get" th:action="@{/logs}" class="row g-2 mb-3">
        <div class="col-auto">
            <select class="form-select" name="connectionId">
                <option value="">全部连接</option>
                <option th:each="c : ${connections}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${c.id == connectionId}"></option>
            </select>
        </div>
        <div class="col-auto">
            <select class="form-select" name="accountId">
                <option value="">全部账号</option>
                <option th:each="a : ${accountIds}" th:value="${a}" th:text="${a}"
                        th:selected="${a == accountId}"></option>
            </select>
        </div>
        <div class="col-auto">
            <select class="form-select" name="status">
                <option value="">全部状态</option>
                <option value="SUCCESS" th:selected="${status == 'SUCCESS'}">SUCCESS</option>
                <option value="ERROR" th:selected="${status == 'ERROR'}">ERROR</option>
                <option value="BLOCKED" th:selected="${status == 'BLOCKED'}">BLOCKED</option>
            </select>
        </div>
        <div class="col-auto">
            <input class="form-control" type="datetime-local" name="from" th:value="${from}" placeholder="起始时间">
        </div>
        <div class="col-auto">
            <input class="form-control" type="datetime-local" name="to" th:value="${to}" placeholder="截止时间">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">筛选</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-success" th:href="@{/logs/export(connectionId=${connectionId},accountId=${accountId},status=${status},from=${from},to=${to})}">导出CSV</a>
        </div>
    </form>

    <table class="table table-hover table-sm">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>连接</th>
            <th>账号</th>
            <th>SQL</th>
            <th>状态</th>
            <th>耗时</th>
            <th>时间</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${logs}">
            <td><a th:href="@{/logs/{id}(id=${l.id})}" th:text="${l.id}"></a></td>
            <td th:text="${l.connectionId}"></td>
            <td th:text="${l.accountId}"></td>
            <td th:text="${#strings.abbreviate(l.sqlText, 60)}"></td>
            <td>
                <span th:if="${l.status == 'SUCCESS'}" class="badge bg-success">SUCCESS</span>
                <span th:if="${l.status == 'ERROR'}" class="badge bg-danger">ERROR</span>
                <span th:if="${l.status == 'BLOCKED'}" class="badge bg-warning text-dark">BLOCKED</span>
            </td>
            <td th:text="${l.durationMs} + 'ms'"></td>
            <td th:text="${#temporals.format(l.executedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(logs.content)}">
            <td colspan="7" class="text-center text-muted">暂无日志</td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments :: pagination(${logs})}"></div>
</div>
</body>
</html>
