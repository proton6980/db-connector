<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('仪表盘')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alert}"></div>
<div class="container mt-3">

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card card-stat">
                <div class="card-body">
                    <div class="stat-value" th:text="${totalLast24h}">0</div>
                    <div class="stat-label">近24h查询量</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat">
                <div class="card-body">
                    <div class="stat-value text-danger" th:text="${errorRate} + '%'">0%</div>
                    <div class="stat-label">错误率</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat">
                <div class="card-body">
                    <div class="stat-value" th:text="${avgDuration} + 'ms'">0ms</div>
                    <div class="stat-label">平均耗时</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat">
                <div class="card-body">
                    <div class="stat-value">
                        <span class="text-success" th:text="${successCount}">0</span> /
                        <span class="text-danger" th:text="${errorCount}">0</span> /
                        <span class="text-warning" th:text="${blockedCount}">0</span>
                    </div>
                    <div class="stat-label">成功/错误/拦截</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <h5>近24h 按小时 QPS</h5>
            <svg width="100%" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
                <rect th:each="hour : ${#numbers.sequence(0,23)}"
                      th:with="count=${hourlyQps.get(hour) ?: 0}, maxVal=${totalLast24h > 0 ? totalLast24h : 1}, h=${count * 120 / maxVal}"
                      th:x="${hour * 20}" th:y="${140 - h}" width="18"
                      th:height="${h > 0 ? h : 0}" fill="#0d6efd" rx="2"/>
                <text th:each="hour : ${#numbers.sequence(0,23)}"
                      th:x="${hour * 20 + 9}" y="155" text-anchor="middle" font-size="9"
                      th:text="${hour}" fill="#6c757d"/>
            </svg>
        </div>
        <div class="col-md-6">
            <h5>状态占比</h5>
            <svg width="100%" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
                <th:block th:with="total=${successCount + errorCount + blockedCount}, sW=${total > 0 ? successCount * 460 / total : 0}, eW=${total > 0 ? errorCount * 460 / total : 0}, bW=${total > 0 ? blockedCount * 460 / total : 0}">
                    <rect x="10" y="30" th:width="${sW}" height="40" fill="#198754" rx="4"/>
                    <text th:x="${10 + sW / 2}" y="55" text-anchor="middle" fill="white" font-size="12"
                          th:text="${successCount} + ' 成功'"></text>
                    <rect th:x="${10 + sW}" y="30" th:width="${eW}" height="40" fill="#dc3545" rx="4"/>
                    <text th:x="${10 + sW + eW / 2}" y="55" text-anchor="middle" fill="white" font-size="12"
                          th:text="${errorCount} + ' 错误'"></text>
                    <rect th:x="${10 + sW + eW}" y="30" th:width="${bW}" height="40" fill="#ffc107" rx="4"/>
                    <text th:x="${10 + sW + eW + bW / 2}" y="55" text-anchor="middle" fill="black" font-size="12"
                          th:text="${blockedCount} + ' 拦截'"></text>
                </th:block>
            </svg>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <h5>Top 5 高频 SQL</h5>
            <table class="table table-sm table-hover">
                <thead class="table-light">
                <tr><th>SQL</th><th>次数</th><th>平均耗时</th></tr>
                </thead>
                <tbody>
                <tr th:each="row : ${topSql}">
                    <td th:text="${#strings.abbreviate(row[0], 80)}"></td>
                    <td th:text="${row[1]}"></td>
                    <td th:text="${#numbers.formatDecimal(row[2] != null ? row[2] : 0, 1, 0)} + 'ms'"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(topSql)}">
                    <td colspan="3" class="text-center text-muted">暂无数据</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-6">
            <h5>连接池状态</h5>
            <table class="table table-sm table-hover">
                <thead class="table-light">
                <tr><th>连接</th><th>活跃</th><th>空闲</th><th>总数</th><th>等待</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${poolStatuses}">
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.active}"></td>
                    <td th:text="${p.idle}"></td>
                    <td th:text="${p.total}"></td>
                    <td th:text="${p.waiting}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(poolStatuses)}">
                    <td colspan="5" class="text-center text-muted">无活跃连接池</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
