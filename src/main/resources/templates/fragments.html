<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">DB Connector</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">DB Connector</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/dashboard}">仪表盘</a>
            <a class="nav-link" th:href="@{/connections}">连接管理</a>
            <a class="nav-link" th:href="@{/logs}">审计日志</a>
        </div>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div th:fragment="alert" class="container mt-2">
    <div th:if="${noPasswordWarning}" class="alert alert-warning">
        未设置控制台口令（DBCONNECTOR_CONSOLE_PASSWORD），任何本机用户均可访问！
    </div>
    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
    <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>
</div>

<nav th:fragment="pagination(page)" aria-label="分页" class="mt-3">
    <ul class="pagination" th:if="${page.totalPages > 1}">
        <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
            <a class="page-link" th:href="@{${paginationPath}(page=0, size=${page.size})}">首页</a>
        </li>
        <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
            <a class="page-link" th:href="@{${paginationPath}(page=${page.number - 1}, size=${page.size})}">上一页</a>
        </li>
        <li class="page-item active">
            <span class="page-link" th:text="${page.number + 1} + '/' + ${page.totalPages}"></span>
        </li>
        <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
            <a class="page-link" th:href="@{${paginationPath}(page=${page.number + 1}, size=${page.size})}">下一页</a>
        </li>
        <li class="page-item" th:classappend="${page.number == page.totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{${paginationPath}(page=${page.totalPages - 1}, size=${page.size})}">末页</a>
        </li>
    </ul>
</nav>

<input th:fragment="csrf" type="hidden" name="_csrf"
       th:value="${session.__csrf}">

</body>
</html>
