<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('登录')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
<div class="card shadow" style="width:360px">
    <div class="card-body">
        <h4 class="card-title text-center mb-4">DB Connector 控制台</h4>
        <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
        <form method="post" th:action="@{/login}">
            <input type="hidden" name="_csrf" th:value="${session.__csrf}">
            <div class="mb-3">
                <label class="form-label" for="password">口令</label>
                <input class="form-control" type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
    </div>
</div>
</body>
</html>
