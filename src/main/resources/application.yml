spring:
  application:
    name: db-connector
  datasource:
    url: jdbc:h2:mem:dbconnector;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  ai:
    mcp:
      server:
        name: db-connector
        version: 0.0.1
        # SSE 端点（默认 /sse），客户端消息回传端点 /mcp/message
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

server:
  port: 8080
