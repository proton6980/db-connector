micronaut:
  application:
    name: db-connector
  mcp:
    server:
      transport: STDIO
  server:
    port: -1
  scheduler:
    enabled: true

datasources:
  default:
    url: jdbc:h2:mem:dbconnector;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=FALSE;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
    schema-generate: NONE

dbconnector:
  query:
    max-rows: 100
    timeout-seconds: 10
  crypto:
    key: ${DBCONNECTOR_CRYPTO_KEY:}

hikaricp:
  maximum-pool-size: 10
  minimum-idle: 2

logger:
  levels:
    io.micronaut: WARN
    com.feiyu: INFO