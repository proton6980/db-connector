micronaut:
  application:
    name: db-connector
  banner:
    enabled: false
  mcp:
    server:
      transport: STDIO
  server:
    port: -1
  scheduler:
    enabled: true

datasources:
  default:
    url: jdbc:h2:file:${dbconnector.data-dir:./data}/dbconnector;MODE=MySQL;DATABASE_TO_UPPER=FALSE;FILE_LOCK=SOCKET;AUTO_SERVER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
    schema-generate: NONE

dbconnector:
  query:
    max-rows: 100
    timeout-seconds: 10

hikaricp:
  maximum-pool-size: 10
  minimum-idle: 2

logger:
  levels:
    io.micronaut: WARN
    com.feiyu: INFO