name: JRE Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.5.0). Leave empty to use current VERSION.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: macos-15
            label: darwin-arm64
          - os: macos-13
            label: darwin-x64
          - os: windows-2022
            label: windows-x64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build & Package
        shell: bash
        run: |
          chmod +x scripts/release.sh scripts/fetch-jre.sh
          ./scripts/release.sh build --skip-test

      - name: Publish Platform Package
        if: github.event_name == 'release' && env.NPM_TOKEN != ''
        working-directory: npm/platforms/${{ matrix.label == 'windows-x64' && 'win32-x64' || matrix.label }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
          npm publish

      - name: Upload Release Asset (tar.gz)
        if: matrix.label != 'windows-x64' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/db-connector-${{ matrix.label }}.tar.gz

      - name: Upload Release Asset (zip)
        if: matrix.label == 'windows-x64' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/db-connector-${{ matrix.label }}.zip

      - name: Dry Run (workflow_dispatch, no NPM_TOKEN)
        if: github.event_name == 'workflow_dispatch' || env.NPM_TOKEN == ''
        shell: bash
        run: |
          echo "=== Dry run: npm pack (main) ==="
          cd npm && npm pack --dry-run
          echo "=== Dry run: npm pack (platform: ${{ matrix.label }}) ==="
          cd platforms/${{ matrix.label == 'windows-x64' && 'win32-x64' || matrix.label }} && npm pack --dry-run

  publish-main:
    needs: build-platforms
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    name: Publish Main Package

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish Main Package
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
          npm publish
