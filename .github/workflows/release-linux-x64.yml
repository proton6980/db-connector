name: Release Linux x64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    name: Build and publish Linux x64
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Prepare version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $RELEASE_TAG. Expected format: vX.Y.Z"
            exit 1
          fi
          printf '%s\n' "${RELEASE_TAG#v}" > VERSION
          chmod +x scripts/release.sh scripts/fetch-jre.sh
          ./scripts/release.sh sync

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and package
        shell: bash
        run: ./scripts/release.sh build

      - name: Publish platform package
        if: env.NPM_TOKEN != ''
        working-directory: npm/platforms/linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
          npm publish

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/db-connector-linux-x64.tar.gz

      - name: Dry run (no NPM_TOKEN)
        if: env.NPM_TOKEN == ''
        shell: bash
        run: |
          cd npm/platforms/linux-x64
          npm pack --dry-run
