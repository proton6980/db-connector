name: JRE CI

on:
  push:
    branches: [main, master]
    paths:
      - 'java/src/**'
      - 'java/pom.xml'
      - 'scripts/fetch-jre.sh'
      - '.github/workflows/native-ci.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  jre-smoke:
    runs-on: ubuntu-24.04
    name: Build + JRE Smoke (Linux x64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build JAR
        working-directory: java
        run: mvn -DskipTests package

      - name: Fetch JRE
        run: bash scripts/fetch-jre.sh npm/platforms/linux-x64/jre

      - name: Copy JAR
        run: cp java/target/db-connector-*.jar npm/platforms/linux-x64/db-connector.jar

      - name: Create Launcher
        run: |
          mkdir -p npm/platforms/linux-x64/bin
          cat > npm/platforms/linux-x64/bin/db-connector <<'LAUNCHER'
#!/bin/sh
APP_HOME=$(CDPATH= cd -- "$(dirname "$0")/.." && pwd)
exec "$APP_HOME/jre/bin/java" -jar "$APP_HOME/db-connector.jar" "$@"
LAUNCHER
          chmod +x npm/platforms/linux-x64/bin/db-connector

      - name: Smoke Test (Web mode)
        run: |
          npm/platforms/linux-x64/bin/db-connector &
          APP_PID=$!
          OK=false
          for i in $(seq 1 15); do
            sleep 2
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:63306/ || echo "000")
            if [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Smoke test passed: HTTP $HTTP_CODE (after ${i}x2s)"
              OK=true
              break
            fi
          done
          kill $APP_PID 2>/dev/null || true
          if [ "$OK" = false ]; then
            echo "Smoke test failed: no 302/200 within 30s"
            exit 1
          fi
